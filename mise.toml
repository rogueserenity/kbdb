[tools]
go = "1.27.0"
aws-cli = "2"
aws-sam-cli = "1.165.0"
mockery = "3.7.3"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[hooks]
postinstall = "go install golang.org/x/tools/gopls@latest"

[tasks.lint]
alias = "l"
description = "Lint Go code and GitHub Actions workflows"
file = "scripts/lint.sh"

[tasks.gen]
alias = "g"
description = "Regenerate mocks, OpenAPI types, and go.mod/go.sum"
file = "scripts/gen.sh"

[tasks.check-generated]
alias = "cg"
description = "Run gen and fail if it changed anything"
file = "scripts/check-generated.sh"

[tasks.test]
alias = "t"
description = "Run unit tests (excludes test/functional)"
file = "scripts/test.sh"

[tasks.build]
alias = "b"
description = "sam build"
file = "scripts/build.sh"

[tasks.dev-setup]
alias = "ds"
description = "One-time per-developer kbdb-dev stack bootstrap (requires an authenticated AWS profile)"
file = "scripts/dev-setup.sh"

[tasks.dev-deploy]
alias = "dd"
description = "Deploy to your personal kbdb-dev-<name> stack (requires an authenticated AWS profile; run dev-setup first)"
file = "scripts/dev-deploy.sh"

[tasks.dev-teardown]
alias = "dt"
description = "Delete your personal kbdb-dev-<name> stack, including its owned ECR repo (requires an authenticated AWS profile)"
file = "scripts/dev-teardown.sh"

[tasks.func-setup]
alias = "fs"
description = "Deploy template.yaml to floci + start the WorkOS emulator for functional testing"
file = "scripts/func-setup.sh"

[tasks.func-teardown]
alias = "ft"
description = "Tear down whatever func-setup started"
file = "scripts/func-teardown.sh"

[tasks.func-test]
alias = "fx"
description = "Run functional tests (Ginkgo) against whatever func-setup brought up"
file = "scripts/func-test.sh"

[tasks.client-gen]
alias = "cx"
description = "Generate a TypeScript client from api/openapi.yaml into ts-client/ (dev-only scratch dir, requires Docker)"
file = "scripts/client-gen.sh"
