name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY_URI: 475976462467.dkr.ecr.us-east-2.amazonaws.com/kbdb-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint
        run: mise run lint

  check-generated:
    name: Check Generated Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Check generated files are up to date
        run: mise run check-generated

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Unit tests
        run: mise run test

  functional-test:
    name: Functional Test
    # Native arm64, matching ApiFunction's real deployed architecture
    # (template.yaml's Architectures: [arm64]) - avoids QEMU-emulated
    # cross-compilation, which failed outright under sam build's Docker
    # build ("exec format error") and would in any case be slower/burn
    # more billed minutes per run than a native arm64 runner for the same
    # per-minute rate (Linux runners aren't multiplier-penalized by arch).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kbdb PR stack (OIDC auth + stack name)
        id: pr-stack
        uses: ./.github/actions/kbdb-pr-stack

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # functions/api/Dockerfile pulls its base images from public.ecr.aws
      # (Lambda provided runtime, aws-lambda-adapter) - anonymous pulls from
      # shared GitHub-hosted runner IPs hit "toomanyrequests: Rate exceeded"
      # in practice; authenticating (even with no special permissions beyond
      # ecr-public:GetAuthorizationToken) raises the effective rate limit
      # since it's tied to the calling identity, not just source IP.
      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: sam build
        run: sam build --config-env ci

      # JWKS_BUCKET_NAME is set as a GitHub Actions repo variable.
      - name: Publish emulator JWKS to S3
        id: emulator-jwks
        run: |
          read -r ISSUER_URL KEY_PATH KID < <(scripts/ci-publish-emulator-jwks.sh \
            "${{ vars.JWKS_BUCKET_NAME }}" "jwks/kbdb-pr-${{ github.event.pull_request.number }}" us-east-2)
          {
            echo "issuer-url=$ISSUER_URL"
            echo "key-path=$KEY_PATH"
            echo "kid=$KID"
          } >> "$GITHUB_OUTPUT"

      - name: Start WorkOS emulator
        run: |
          docker run --rm -d -p 4100:4100 --name workos-emulate \
            -e WORKOS_EMULATE_ISSUER="${{ steps.emulator-jwks.outputs.issuer-url }}" \
            -e WORKOS_EMULATE_KID="${{ steps.emulator-jwks.outputs.kid }}" \
            -v "${{ steps.emulator-jwks.outputs.key-path }}:/keys/signing-key.pem:ro" \
            ghcr.io/workos/emulate --host 0.0.0.0 --signing-key /keys/signing-key.pem
          for _ in $(seq 1 20); do
            curl -sf http://localhost:4100/health && break
            sleep 0.5
          done

      - name: sam deploy
        run: |
          sam deploy \
            --config-env ci \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --image-repositories "ApiFunction=${ECR_REPOSITORY_URI}" \
            --parameter-overrides "SkipApiRepository=true" \
              "WorkOSAuthKitDomain=$(echo '${{ steps.emulator-jwks.outputs.issuer-url }}' | sed 's|^https://||')" \
              "WorkOSUserManagementClientId=client_local_kbdb" \
            --tags "kbdb:pr=pr-${{ github.event.pull_request.number }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          SWITCH_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SwitchTableName'].OutputValue" \
            --output text)
          KEYBOARD_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='KeyboardTableName'].OutputValue" \
            --output text)
          KEYCAP_SET_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='KeycapSetTableName'].OutputValue" \
            --output text)
          BUILD_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='BuildTableName'].OutputValue" \
            --output text)
          {
            echo "api-url=$API_URL"
            echo "switch-table-name=$SWITCH_TABLE_NAME"
            echo "keyboard-table-name=$KEYBOARD_TABLE_NAME"
            echo "keycap-set-table-name=$KEYCAP_SET_TABLE_NAME"
            echo "build-table-name=$BUILD_TABLE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Create test users and mint emulator tokens
        id: auth-token
        run: |
          PASSWORD="$(openssl rand -base64 24)Aa1!"

          create_and_mint() {
            local email="$1"
            curl -sf -X POST http://localhost:4100/user_management/users \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer sk_test_default" \
              -d "{\"email\":\"$email\",\"password\":\"$PASSWORD\",\"email_verified\":true}" >/dev/null

            curl -sf -X POST http://localhost:4100/user_management/authenticate \
              -H "Content-Type: application/json" \
              -d "{\"client_id\":\"client_local_kbdb\",\"client_secret\":\"sk_test_default\",\"grant_type\":\"password\",\"email\":\"$email\",\"password\":\"$PASSWORD\"}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])"
          }

          TOKEN=$(create_and_mint "ci-test-user@rogueserenity.dev")
          SECOND_USER_TOKEN=$(create_and_mint "ci-test-user-2@rogueserenity.dev")

          echo "::add-mask::$TOKEN"
          echo "::add-mask::$SECOND_USER_TOKEN"
          {
            echo "token=$TOKEN"
            echo "second-user-token=$SECOND_USER_TOKEN"
          } >> "$GITHUB_OUTPUT"

      - name: Run functional tests
        env:
          KBDB_API_BASE_URL: ${{ steps.stack-outputs.outputs.api-url }}
          KBDB_AUTH_TOKEN: ${{ steps.auth-token.outputs.token }}
          KBDB_SECOND_USER_AUTH_TOKEN: ${{ steps.auth-token.outputs.second-user-token }}
          KBDB_SWITCH_TABLE_NAME: ${{ steps.stack-outputs.outputs.switch-table-name }}
          KBDB_KEYBOARD_TABLE_NAME: ${{ steps.stack-outputs.outputs.keyboard-table-name }}
          KBDB_KEYCAP_SET_TABLE_NAME: ${{ steps.stack-outputs.outputs.keycap-set-table-name }}
          KBDB_BUILD_TABLE_NAME: ${{ steps.stack-outputs.outputs.build-table-name }}
          # Explicitly empty (not omitted) - func-test.sh only falls back to
          # its LocalStack default for a genuinely unset variable.
          KBDB_DYNAMODB_ENDPOINT_URL: ""
        run: mise run func-test
