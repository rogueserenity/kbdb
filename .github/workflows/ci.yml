name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY_URI: 475976462467.dkr.ecr.us-east-2.amazonaws.com/kbdb-api

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Lint
        run: mise run lint

  unit-test:
    name: Unit Test
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Unit tests
        run: mise run test

  functional-test:
    name: Functional Test
    if: github.event.action != 'edited'
    # Native arm64, matching ApiFunction's real deployed architecture
    # (template.yaml's Architectures: [arm64]) - avoids QEMU-emulated
    # cross-compilation, which failed outright under sam build's Docker
    # build ("exec format error") and would in any case be slower/burn
    # more billed minutes per run than a native arm64 runner for the same
    # per-minute rate (Linux runners aren't multiplier-penalized by arch).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kbdb PR stack (OIDC auth + stack name)
        id: pr-stack
        uses: ./.github/actions/kbdb-pr-stack

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # functions/api/Dockerfile pulls its base images from public.ecr.aws
      # (Lambda provided runtime, aws-lambda-adapter) - anonymous pulls from
      # shared GitHub-hosted runner IPs hit "toomanyrequests: Rate exceeded"
      # in practice; authenticating (even with no special permissions beyond
      # ecr-public:GetAuthorizationToken) raises the effective rate limit
      # since it's tied to the calling identity, not just source IP.
      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: sam build
        run: sam build --config-env ci

      - name: sam deploy
        run: |
          sam deploy \
            --config-env ci \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --image-repositories "ApiFunction=${ECR_REPOSITORY_URI}" \
            --parameter-overrides "SkipApiRepository=true" \
            --tags "kbdb:pr=pr-${{ github.event.pull_request.number }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          LOOKUP_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='LookupTableName'].OutputValue" \
            --output text)
          SWITCH_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SwitchTableName'].OutputValue" \
            --output text)
          {
            echo "api-url=$API_URL"
            echo "user-pool-id=$USER_POOL_ID"
            echo "user-pool-client-id=$USER_POOL_CLIENT_ID"
            echo "lookup-table-name=$LOOKUP_TABLE_NAME"
            echo "switch-table-name=$SWITCH_TABLE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Create throwaway Cognito test users and mint tokens
        id: auth-token
        run: |
          USER_POOL_ID="${{ steps.stack-outputs.outputs.user-pool-id }}"
          USER_POOL_CLIENT_ID="${{ steps.stack-outputs.outputs.user-pool-client-id }}"
          PASSWORD="$(openssl rand -base64 24)Aa1!"

          TOKEN=$(scripts/ci-create-test-user.sh "$USER_POOL_ID" "$USER_POOL_CLIENT_ID" \
            "ci-test-user@rogueserenity.dev" "$PASSWORD")
          ADMIN_TOKEN=$(scripts/ci-create-test-user.sh "$USER_POOL_ID" "$USER_POOL_CLIENT_ID" \
            "ci-test-admin@rogueserenity.dev" "$PASSWORD" "admins")
          SECOND_USER_TOKEN=$(scripts/ci-create-test-user.sh "$USER_POOL_ID" "$USER_POOL_CLIENT_ID" \
            "ci-test-user-2@rogueserenity.dev" "$PASSWORD")

          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ADMIN_TOKEN"
          echo "::add-mask::$SECOND_USER_TOKEN"
          {
            echo "token=$TOKEN"
            echo "admin-token=$ADMIN_TOKEN"
            echo "second-user-token=$SECOND_USER_TOKEN"
          } >> "$GITHUB_OUTPUT"

      - name: Run functional tests
        env:
          KBDB_API_BASE_URL: ${{ steps.stack-outputs.outputs.api-url }}
          KBDB_AUTH_TOKEN: ${{ steps.auth-token.outputs.token }}
          KBDB_ADMIN_AUTH_TOKEN: ${{ steps.auth-token.outputs.admin-token }}
          KBDB_SECOND_USER_AUTH_TOKEN: ${{ steps.auth-token.outputs.second-user-token }}
          KBDB_LOOKUP_TABLE_NAME: ${{ steps.stack-outputs.outputs.lookup-table-name }}
          KBDB_SWITCH_TABLE_NAME: ${{ steps.stack-outputs.outputs.switch-table-name }}
          # Explicitly empty (not omitted) - func-test.sh only falls back to
          # its LocalStack default for a genuinely unset variable.
          KBDB_DYNAMODB_ENDPOINT_URL: ""
        run: mise run func-test
