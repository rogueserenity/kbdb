name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY_URI: 475976462467.dkr.ecr.us-east-2.amazonaws.com/kbdb-api

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Lint
        run: mise run lint

  unit-test:
    name: Unit Test
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Unit tests
        run: mise run test

  functional-test:
    name: Functional Test
    if: github.event.action != 'edited'
    # Native arm64, matching ApiFunction's real deployed architecture
    # (template.yaml's Architectures: [arm64]) - avoids QEMU-emulated
    # cross-compilation, which failed outright under sam build's Docker
    # build ("exec format error") and would in any case be slower/burn
    # more billed minutes per run than a native arm64 runner for the same
    # per-minute rate (Linux runners aren't multiplier-penalized by arch).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up kbdb PR stack (OIDC auth + stack name)
        id: pr-stack
        uses: ./.github/actions/kbdb-pr-stack

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # functions/api/Dockerfile pulls its base images from public.ecr.aws
      # (Lambda provided runtime, aws-lambda-adapter) - anonymous pulls from
      # shared GitHub-hosted runner IPs hit "toomanyrequests: Rate exceeded"
      # in practice; authenticating (even with no special permissions beyond
      # ecr-public:GetAuthorizationToken) raises the effective rate limit
      # since it's tied to the calling identity, not just source IP.
      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: sam build
        run: sam build --config-env ci

      - name: sam deploy
        run: |
          sam deploy \
            --config-env ci \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --image-repositories "ApiFunction=${ECR_REPOSITORY_URI}" \
            --parameter-overrides "SkipApiRepository=true" \
            --tags "kbdb:pr=pr-${{ github.event.pull_request.number }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.pr-stack.outputs.stack-name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          {
            echo "api-url=$API_URL"
            echo "user-pool-id=$USER_POOL_ID"
            echo "user-pool-client-id=$USER_POOL_CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Create throwaway Cognito test user and mint a token
        id: auth-token
        run: |
          USER_POOL_ID="${{ steps.stack-outputs.outputs.user-pool-id }}"
          USER_POOL_CLIENT_ID="${{ steps.stack-outputs.outputs.user-pool-client-id }}"
          USERNAME="ci-test-user@rogueserenity.dev"
          PASSWORD="$(openssl rand -base64 24)Aa1!"

          # synchronize (a later push to the same PR) redeploys the same
          # stack/UserPool rather than a fresh one, so this fixed username
          # already exists from the prior run - delete first. Only swallow
          # the specific "didn't exist yet" case (a genuinely first run
          # against a fresh stack); any other failure (throttling, a real
          # permissions regression, etc.) should fail loudly here rather
          # than surface later as a confusing UsernameExistsException from
          # admin-create-user below.
          if ! DELETE_ERROR=$(aws cognito-idp admin-delete-user \
            --user-pool-id "$USER_POOL_ID" \
            --username "$USERNAME" 2>&1); then
            if ! grep -q "UserNotFoundException" <<< "$DELETE_ERROR"; then
              echo "$DELETE_ERROR" >&2
              exit 1
            fi
          fi

          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" \
            --username "$USERNAME" \
            --user-attributes Name=email,Value="$USERNAME" Name=email_verified,Value=true \
            --message-action SUPPRESS

          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" \
            --username "$USERNAME" \
            --password "$PASSWORD" \
            --permanent

          TOKEN=$(aws cognito-idp admin-initiate-auth \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$USER_POOL_CLIENT_ID" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters USERNAME="$USERNAME",PASSWORD="$PASSWORD" \
            --query "AuthenticationResult.IdToken" \
            --output text)

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run functional tests
        env:
          KBDB_API_BASE_URL: ${{ steps.stack-outputs.outputs.api-url }}
          KBDB_AUTH_TOKEN: ${{ steps.auth-token.outputs.token }}
        run: mise run func-test
