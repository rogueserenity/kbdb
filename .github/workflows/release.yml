name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release created with the default GITHUB_TOKEN doesn't trigger
      # other workflows (GitHub's anti-loop restriction on Actions-bot
      # events) - publish-clients.yml's `on: release: published` would
      # never fire. An App token isn't subject to that restriction.
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RS_TOKEN_APP_ID }}
          private-key: ${{ secrets.RS_TOKEN_APP_PK }}

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
