name: Publish TS Client

on:
  release:
    types: [published]

concurrency:
  group: publish-ts-client-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CLIENT_GEN_OUT_DIR: client

jobs:
  publish-ts-client:
    name: Publish TS client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Generate client
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CLIENT_GEN_VERSION="${RELEASE_TAG#v}" scripts/client-gen.sh

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22 # Active LTS; 24 doesn't enter LTS until Oct 2026
          registry-url: https://npm.pkg.github.com
          scope: "@rogueserenity"

      - name: Set publish registry
        run: npm pkg set publishConfig.registry=https://npm.pkg.github.com
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}

      - name: Install and build
        run: npm install
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: ${{ env.CLIENT_GEN_OUT_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
