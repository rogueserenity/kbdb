<!DOCTYPE html>
<!--
  IdP-specific, like authorize.html: embeds the deployment's IdP browser SDK
  (currently Stytch's @stytch/vanilla-js) to revoke the session on this origin.
-->
<html>
<head>
<meta charset="utf-8" />
<title>kbdb — Sign out</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    max-width: 480px;
    margin: 4rem auto;
    padding: 0 1rem;
    background: #141316;
    color: #ede7dd;
  }
</style>
</head>
<body>
  <p id="status">Signing out…</p>

  <script type="module">
    import { StytchClient } from 'https://esm.sh/@stytch/vanilla-js@6.2.0';

    const PUBLIC_TOKEN = {{.IDPConsentPublicToken}};
    const RETURN_TO = {{.ReturnTo}};

    const idpClient = new StytchClient(PUBLIC_TOKEN, {
      customBaseUrl: {{.OIDCIssuerBaseURL}},
    });

    idpClient.session.revoke().catch(() => {}).finally(() => {
      window.location.assign(RETURN_TO);
    });
  </script>
</body>
</html>
