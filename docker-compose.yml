services:
  mockoidc:
    build:
      context: .
      dockerfile: test/functional/support/mockoidc/Dockerfile
    environment:
      # Baked into every signed JWT's iss claim and the discovery document -
      # must match whatever OIDC_ISSUER_URL the app under test (running
      # inside sam local start-api's Lambda container, on this same compose
      # network) is configured with, since that's the side that actually
      # performs OIDC issuer validation (go-oidc's oidc.NewProvider). The
      # Ginkgo functional specs, by contrast, never verify a token
      # themselves - they only mint one via mockoidc's authorize/token
      # endpoints and relay it in a header - so they don't need this value
      # to match anything; they reach mockoidc via the published host port
      # instead (see test/functional/support/env.go's MockOIDCTokenURL).
      - MOCKOIDC_ADVERTISE_ADDR=mockoidc:9999
    ports:
      - "9999:9999"

  localstack:
    image: localstack/localstack:latest
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN - sign up free at localstack.cloud}
      - SERVICES=lambda,dynamodb,s3
      # A presigned S3 URL minted by the Lambda container (signed against
      # the internal hostname localstack:4566) is rewritten by
      # test/functional/support/api's HTTP client to the published host
      # port (localhost:4566) before the Ginkgo suite dials it, so the
      # rewritten request's Host no longer matches what was signed.
      # LocalStack's own signature validation has known bugs/inconsistency
      # around this exact host-mismatch case anyway - skip it here rather
      # than fight it. Local/CI-only; production S3 always validates real
      # signatures normally, this never applies there.
      - S3_SKIP_SIGNATURE_VALIDATION=1
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  workos-emulate:
    image: ghcr.io/workos/emulate:latest
    environment:
      - WORKOS_EMULATE_ISSUER=http://workos-emulate:4100
    ports:
      - "4100:4100"
    volumes:
      - ./scripts/workos-emulate-seed.yaml:/app/workos-emulate.config.yaml:ro
