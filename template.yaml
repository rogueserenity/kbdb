AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kbdb - keyboard database. Infrastructure for the kbdb API: a single
  Lambda function fronted by an HTTP API with a Cognito JWT authorizer,
  DynamoDB tables, an S3 bucket for images, and a budget cost tripwire.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Parameters:
  SkipApiRepository:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'true' for per-PR CI stacks (kbdb-pr-<N>) sharing the kbdb-ci
      account's single bootstrap-created ECR repo (bootstrap/ecr-repo.yaml) -
      every PR's image is pushed to that one shared, already-existing repo,
      so a per-PR stack must not also try to create its own repo of the same
      name (CloudFormation's early validation correctly refuses to create a
      duplicate). Left at the default 'false' for the real kbdb-dev stack,
      which does own and manage its repo via this template.

Conditions:
  ShouldCreateApiRepository: !Equals [!Ref SkipApiRepository, 'false']

Resources:
  # Dedicated ECR repo for ApiFunction's container image, declared in-template
  # (rather than SAM's implicit auto-managed repo) so a lifecycle policy can
  # be attached and version-controlled. Point `sam build`/`sam deploy` at it
  # via `--image-repositories ApiFunction=<this repo's URI>` (CLI flag or
  # samconfig.toml) - there is no in-template property linking a function to
  # a specific ECR repo for the build/push step.
  #
  # LifecyclePolicy uses imageCountMoreThan rather than sinceImagePushed: a
  # pure age-based rule (the original version of this policy) has no floor -
  # it would expire the currently-deployed image out from under the running
  # Lambda function if development goes quiet for longer than the age
  # threshold. imageCountMoreThan always keeps at least the N newest images
  # regardless of age (confirmed via AWS's own lifecycle-policy examples),
  # so it can never delete the live image while still bounding total count.
  ApiRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateApiRepository
    Properties:
      # Stack-name-derived, not a literal - each per-developer kbdb-dev-<name>
      # stack owns its own repo (same class of collision the UserPoolDomain
      # fix addressed for the Cognito hosted-UI domain; here for ECR).
      RepositoryName: !Sub kbdb-api-${AWS::StackName}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 5 most recent images, expire the rest",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Holds user-uploaded images (build photos, keycap kit renders). Private -
  # access only via presigned URLs minted by ApiFunction after an ownership/
  # sharing check. Stack-scoped like ApiRepository/UserPoolDomain (no
  # per-bucket cost, keeps environments isolated).
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      # AccountId+StackName suffix: S3 bucket names are globally unique, and
      # multiple kbdb-pr-<N> stacks share the kbdb-ci account.
      BucketName: !Sub kbdb-images-${AWS::AccountId}-${AWS::StackName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # User-owned switches. user_id (Cognito subject, the owner) is the
  # partition key, id the sort key - every real access pattern is scoped to
  # an already-known user_id (see README's DynamoDB rationale), so no GSI is
  # needed; visibility filtering happens as a Query filter expression, not
  # an index. scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack (sam local start-api doesn't run a real CloudFormation
  # deploy) - keep that script's schema in sync with this resource.
  SwitchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keyboards. Same key schema/rationale as SwitchTable above.
  # scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack - keep that script's schema in sync with this resource.
  KeyboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # User-owned keycap sets. Same key schema/rationale as SwitchTable above.
  # scripts/func-setup.sh hand-creates an equivalent table against
  # LocalStack - keep that script's schema in sync with this resource.
  KeycapSetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  BuildTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # Matches ApiFunction's explicit FunctionName below so Lambda writes here
  # instead of auto-creating an unmanaged, never-expiring log group.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kbdb-api-${AWS::StackName}
      RetentionInDays: 14

  # Single Lambda function for all routes (REST entities + MCP), not split
  # by protocol or by entity - see plan rationale. Packaged as a container
  # image (aws-lambda-web-adapter sidecar) rather than a zip - see
  # functions/api/Dockerfile.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kbdb-api-${AWS::StackName}
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          OIDC_ISSUER_URL: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
          OIDC_AUDIENCE: !Ref UserPoolClient
          IMAGES_BUCKET_NAME: !Ref ImagesBucket
          SWITCH_TABLE_NAME: !Ref SwitchTable
          KEYBOARD_TABLE_NAME: !Ref KeyboardTable
          KEYCAP_SET_TABLE_NAME: !Ref KeycapSetTable
          BUILD_TABLE_NAME: !Ref BuildTable
          # Empty in real deployments; sam local's --env-vars override
          # (env.local.json) can only override a var declared here.
          DYNAMODB_ENDPOINT_URL: ""
          S3_ENDPOINT_URL: ""
          # Not 8080: sam local start-api's Runtime Interface Emulator already
          # binds that port in-container. Must match functions/api/main.go's
          # port const.
          AWS_LWA_PORT: "8000"
      # Hand-written, not SAM's S3CrudPolicy/DynamoDBReadPolicy (those grant
      # extra actions we don't need). Presigned URLs inherit this role's
      # permissions, so Put/Get cover upload/download; Delete is for the
      # DELETE-image endpoints.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${ImagesBucket.Arn}/*"
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt SwitchTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt KeyboardTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt KeycapSetTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt BuildTable.Arn
      Events:
        # No auth: security: [] in api/openapi.yaml. Lookup categories are
        # static, deploy-time data (internal/lookup) - GET only, no write
        # routes.
        LookupsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/lookups
            Method: get
            Auth:
              Authorizer: NONE
        # No auth: security: [] in api/openapi.yaml.
        GetLookupEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/lookups/{category}
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway (security: [{}, CognitoAuth] in
        # api/openapi.yaml - anonymous callers are allowed); the app enforces
        # per-item visibility itself via middleware.OptionalAuth and
        # internal/authz.ReadableVisibilities.
        ListSwitchesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListSwitchesEvent.
        GetSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default CognitoAuthorizer applies (security: [CognitoAuth] in
        # api/openapi.yaml, no anonymous override, unlike the GET routes) -
        # ownership is checked at the app layer by authz.IsOwner.
        CreateSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches
            Method: post
        # Default CognitoAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        UpdateSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: put
        # Default CognitoAuthorizer applies - same rationale as
        # CreateSwitchEvent.
        DeleteSwitchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/switches/{switchId}
            Method: delete
        # Auth: NONE at the gateway (security: [{}, CognitoAuth] in
        # api/openapi.yaml - anonymous callers are allowed); the app enforces
        # per-item visibility itself via middleware.OptionalAuth and
        # internal/authz.ReadableVisibilities.
        ListKeyboardsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default CognitoAuthorizer applies (security: [CognitoAuth] in
        # api/openapi.yaml, no anonymous override, unlike the GET routes) -
        # ownership is checked at the app layer by authz.IsOwner.
        CreateKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards
            Method: post
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: put
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeyboardEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keyboards/{keyboardId}
            Method: delete
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        ListKeycapSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets
            Method: get
            Auth:
              Authorizer: NONE
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets
            Method: post
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: put
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteKeycapSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}
            Method: delete
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits
            Method: post
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}
            Method: put
        DeleteKeycapKitEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}
            Method: delete
        SetKeycapKitImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}/image
            Method: post
        DeleteKeycapKitImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/keycap-sets/{keycapSetId}/kits/{kitId}/image
            Method: delete
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        ListBuildsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds
            Method: get
            Auth:
              Authorizer: NONE
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        CreateBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds
            Method: post
        # Auth: NONE at the gateway - same rationale as ListKeyboardsEvent.
        GetBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: get
            Auth:
              Authorizer: NONE
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        UpdateBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: put
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        DeleteBuildEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}
            Method: delete
        # Default CognitoAuthorizer applies - same rationale as
        # CreateKeyboardEvent.
        AddBuildImageEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/users/{userId}/builds/{buildId}/images
            Method: post
        # Authorizer: NONE is deliberate on all three MCP routes below -
        # internal/mcp handles auth itself and needs the request to reach it.
        McpEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /mcp
            Method: any
            Auth:
              Authorizer: NONE
        McpMetadataEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /.well-known/oauth-protected-resource
            Method: get
            Auth:
              Authorizer: NONE
        McpMetadataMcpEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /.well-known/oauth-protected-resource/mcp
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      # DockerContext is the repo root, not functions/api/, so the build has
      # access to the whole Go module (internal/ packages, go.mod/go.sum) -
      # the Dockerfile itself still lives in functions/api/.
      Dockerfile: functions/api/Dockerfile
      DockerContext: .
      DockerTag: latest

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kbdb-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      # Placeholder - replace with the real client callback URL(s) once a
      # real client/UI exists.
      CallbackURLs:
        - https://example.com/callback
      SupportedIdentityProviders:
        - COGNITO
      # Required for ci.yml's functional-test job to mint a test token via
      # admin-initiate-auth (ADMIN_USER_PASSWORD_AUTH) against a throwaway
      # Cognito user. Declared here rather than left to CI's own
      # update-user-pool-client call so this is real, version-controlled
      # stack configuration - every deployed stack (kbdb-dev included) gets
      # it, not just ones that happen to go through that exact CI step.
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Cognito-prefix domains are globally unique across all AWS accounts
      # in the region - suffixed with the account ID AND stack name to avoid
      # collision. Account ID alone isn't enough: every kbdb-pr-<N> CI stack
      # deploys into the same kbdb-ci account, so two PR stacks open at once
      # would otherwise collide on this exact domain (a real, if
      # not-yet-triggered, bug - every CI run so far has tested one PR stack
      # at a time).
      Domain: !Sub kbdb-auth-${AWS::AccountId}-${AWS::StackName}
      UserPoolId: !Ref UserPool

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  UserPoolHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub https://kbdb-auth-${AWS::AccountId}-${AWS::StackName}.auth.${AWS::Region}.amazoncognito.com
  ImagesBucketName:
    Description: S3 bucket holding user-uploaded images (build photos, keycap kit renders)
    Value: !Ref ImagesBucket
  SwitchTableName:
    Description: DynamoDB table backing GET /users/{userId}/switches
    Value: !Ref SwitchTable
  KeyboardTableName:
    Description: DynamoDB table backing GET /users/{userId}/keyboards
    Value: !Ref KeyboardTable
  KeycapSetTableName:
    Description: DynamoDB table backing GET /users/{userId}/keycap-sets
    Value: !Ref KeycapSetTable
  BuildTableName:
    Description: DynamoDB table backing GET /users/{userId}/builds
    Value: !Ref BuildTable
