AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kbdb - keyboard database. Phase 0 skeleton: single Lambda function fronted
  by an HTTP API with a Cognito JWT authorizer, plus a budget cost tripwire.
  No DynamoDB tables yet (Phase 1). ApiFunction runs a plain net/http server
  behind the aws-lambda-web-adapter extension, packaged as a container image.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Parameters:
  SkipApiRepository:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'true' for per-PR CI stacks (kbdb-pr-<N>) sharing the kbdb-ci
      account's single bootstrap-created ECR repo (bootstrap/ecr-repo.yaml) -
      every PR's image is pushed to that one shared, already-existing repo,
      so a per-PR stack must not also try to create its own repo of the same
      name (CloudFormation's early validation correctly refuses to create a
      duplicate). Left at the default 'false' for the real kbdb-dev stack,
      which does own and manage its repo via this template.

Conditions:
  ShouldCreateApiRepository: !Equals [!Ref SkipApiRepository, 'false']

Resources:
  # Dedicated ECR repo for ApiFunction's container image, declared in-template
  # (rather than SAM's implicit auto-managed repo) so a lifecycle policy can
  # be attached and version-controlled. Point `sam build`/`sam deploy` at it
  # via `--image-repositories ApiFunction=<this repo's URI>` (CLI flag or
  # samconfig.toml) - there is no in-template property linking a function to
  # a specific ECR repo for the build/push step.
  ApiRepository:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateApiRepository
    Properties:
      RepositoryName: kbdb-api
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire per-PR CI images 2 days after push",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["pr-"],
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Single Lambda function for all routes (REST entities + MCP), not split
  # by protocol or by entity - see plan rationale. Only /v1/ping is wired up
  # here; MCP and per-entity routes are added as additional Events on this
  # same function later. Packaged as a container image (aws-lambda-web-adapter
  # sidecar) rather than a zip - see functions/api/Dockerfile.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          OIDC_ISSUER_URL: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
          OIDC_AUDIENCE: !Ref UserPoolClient
          # Not 8080: sam local start-api's Runtime Interface Emulator already
          # binds that port in-container. Must match functions/api/main.go's
          # port const.
          AWS_LWA_PORT: "8000"
      Events:
        PingEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/ping
            Method: get
        # MCP auth is handled inside the MCP server itself (see internal/mcp),
        # returning MCP-shaped protocol errors rather than a bare HTTP 401 -
        # bypass API Gateway's Cognito authorizer for this route so a missing/
        # invalid token still reaches the app and gets an MCP-shaped response.
        McpEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /mcp
            Method: any
            Auth:
              Authorizer: NONE
        McpMetadataEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /.well-known/oauth-protected-resource
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      # DockerContext is the repo root, not functions/api/, so the build has
      # access to the whole Go module (internal/ packages, go.mod/go.sum) -
      # the Dockerfile itself still lives in functions/api/.
      Dockerfile: functions/api/Dockerfile
      DockerContext: .
      DockerTag: latest

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kbdb-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      # Placeholder - replace with the real client callback URL(s) once a
      # real client/UI exists.
      CallbackURLs:
        - https://example.com/callback
      SupportedIdentityProviders:
        - COGNITO
      # Required for ci.yml's functional-test job to mint a test token via
      # admin-initiate-auth (ADMIN_USER_PASSWORD_AUTH) against a throwaway
      # Cognito user. Declared here rather than left to CI's own
      # update-user-pool-client call so this is real, version-controlled
      # stack configuration - every deployed stack (kbdb-dev included) gets
      # it, not just ones that happen to go through that exact CI step.
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Cognito-prefix domains are globally unique across all AWS accounts
      # in the region - suffixed with the account ID to avoid collision.
      Domain: !Sub kbdb-auth-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  UserPoolHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub https://kbdb-auth-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
