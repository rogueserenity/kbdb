AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kbdb - keyboard database. Phase 0 skeleton: single Lambda function fronted
  by an HTTP API with a Cognito JWT authorizer, plus a budget cost tripwire.
  No DynamoDB tables yet (Phase 1). Lambda code is a placeholder stub,
  replaced by real handler logic in a follow-up issue.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  # Single Lambda function for all routes (REST entities + MCP), not split
  # by protocol or by entity - see plan rationale. Only /v1/ping is wired up
  # here; MCP and per-entity routes are added as additional Events on this
  # same function later.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Events:
        PingEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/ping
            Method: get
    Metadata:
      BuildMethod: go1.x

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kbdb-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      # Placeholder - replace with the real client callback URL(s) once a
      # real client/UI exists.
      CallbackURLs:
        - https://example.com/callback
      SupportedIdentityProviders:
        - COGNITO

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Cognito-prefix domains are globally unique across all AWS accounts
      # in the region - suffixed with the account ID to avoid collision.
      Domain: !Sub kbdb-auth-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: aws-budget@rogueserenity.dev

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  UserPoolHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub https://kbdb-auth-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
