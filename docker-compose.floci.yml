services:
  workos-emulate:
    image: ghcr.io/workos/emulate:0.9.0@sha256:292cf6d8c84743ebf218dc12c316f51d93d839c9e62fb2b46d16bdae7b093237
    environment:
      # @workos/emulate has no discovery endpoint, so scripts/func-setup.sh
      # publishes a static .well-known/openid-configuration to floci's S3
      # whose issuer matches this and whose jwks_uri points back at this
      # container's own live /oauth2/jwks - no pinned signing key needed,
      # the emulator generates its own at startup and this is the only
      # value that has to be known in advance. localhost.floci.io resolves
      # to floci's container IP for siblings and to 127.0.0.1 for the host
      # (see FLOCI_HOSTNAME below), so both the Lambda container and the
      # host-side test runner reach the same issuer.
      - WORKOS_EMULATE_ISSUER=http://localhost.floci.io:4566/kbdb-floci-oidc
    ports:
      - "4100:4100"
    volumes:
      - ./scripts/workos-emulate-seed.yaml:/app/workos-emulate.config.yaml:ro

  floci:
    # nightly tracks upstream/main; switch to a pinned version tag once
    # floci-io/floci cuts a release containing #2146 and #2150.
    image: floci/floci:nightly
    environment:
      # Both the host-side test process and the Lambda container must reach
      # the issuer at the same name. floci's embedded DNS resolves this to
      # its own container IP for siblings; public DNS resolves it to
      # 127.0.0.1 for the host.
      - FLOCI_HOSTNAME=localhost.floci.io
      # path-style ECR URIs (localhost:5100/<acct>/<region>/<repo>) are what
      # sam deploy --image-repositories accepts as a valid ECR URI; the
      # default hostname style is rejected client-side.
      - FLOCI_SERVICES_ECR_URI_STYLE=path
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
