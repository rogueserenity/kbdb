#:tombi schema.strict = false
version = 0.1

[default.deploy.parameters]
stack_name = "kbdb-dev"
# Explicit, version-controlled bucket (see bootstrap/artifact-bucket.yaml)
# instead of resolve_s3's auto-managed one, so a lifecycle policy (expire
# noncurrent versions after 7 days) can be attached - deploy the bootstrap
# template once per account before the first sam deploy there.
s3_bucket = "kbdb-sam-artifacts-992234857260"
s3_prefix = "kbdb-dev"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = ["ApiFunction=992234857260.dkr.ecr.us-east-2.amazonaws.com/kbdb-api"]

[default.global.parameters]
region = "us-east-2"

[default.local_start_api.parameters]
env_vars = "test/functional/support/env.local.json"
docker_network = "kbdb_default"

# CI deploys per-PR stacks into the separate kbdb-ci account (475976462467),
# selected via `sam build/deploy --config-env ci`. stack_name and
# image_repositories are deliberately NOT set here - both are supplied
# per-run via CLI flags (--stack-name kbdb-pr-<N>, computed by
# .github/actions/kbdb-pr-stack), so a CI run can never accidentally
# collide with or reuse kbdb-dev's [default.*] values above.
[ci.deploy.parameters]
s3_bucket = "kbdb-sam-artifacts-475976462467"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
