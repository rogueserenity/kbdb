#:tombi schema.strict = false
version = 0.1

# kbdb-dev hosts multiple concurrent per-developer stacks (kbdb-dev-<name>,
# see mise.toml's dev-setup/dev-deploy/dev-teardown tasks and CONTRIBUTING.md),
# not one shared stack - stack_name and image_repositories are deliberately NOT
# set here, same reasoning as [ci.deploy.parameters] below: both are supplied
# per-run by those tasks, so no single hardcoded value here could accidentally
# be reused across developers.
[default.deploy.parameters]
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"

[default.global.parameters]
region = "us-east-2"

# CI deploys per-PR stacks into the separate kbdb-ci account (475976462467),
# selected via `sam build/deploy --config-env ci`. stack_name and
# image_repositories are deliberately NOT set here - both are supplied
# per-run via CLI flags (--stack-name kbdb-pr-<N>, computed by
# .github/actions/kbdb-pr-stack), so a CI run can never accidentally
# collide with or reuse kbdb-dev's [default.*] values above.
[ci.deploy.parameters]
s3_bucket = "kbdb-sam-artifacts-475976462467"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
