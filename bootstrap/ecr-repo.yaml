AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time-per-account bootstrap: creates the ECR repo standalone, so an
  initial image can be pushed to it before the first sam deploy (sam deploy
  needs to push ApiFunction's image to resolve its ImageUri parameter before
  creating/updating the stack, but template.yaml's own ApiRepository
  resource can't exist yet on a fresh account - a chicken-and-egg problem
  with no first-party SAM fix). After this bootstrap and an initial image
  push, import this repo into the app stack via an IMPORT-type changeset so
  template.yaml "owns" it from then on - see the procedure in CLAUDE.md.

  DeletionPolicy: Retain is required here even before the import: it's a
  hard CloudFormation prerequisite that any resource targeted for import
  into another stack already carry an explicit DeletionPolicy at import
  time - carrying it from creation avoids needing a separate update step
  later just to add it.

Parameters:
  RepositoryName:
    Type: String
    Default: kbdb-api
    Description: >
      Defaults to kbdb-api (kbdb-ci's shared per-PR-CI-image repo, this
      template's original use case, unaffected). mise run dev-setup
      overrides this to kbdb-api-<per-developer stack name> when
      bootstrapping a new developer's own fully-owned repo in kbdb-dev.

Resources:
  # LifecyclePolicy expires by age alone (tagStatus: "any"), not a tag
  # pattern: kbdb-ci only ever holds transient per-PR CI build artifacts,
  # nothing long-lived, so age is the right and only signal - and there's no
  # "live" image here to accidentally protect, unlike kbdb-dev's copy of this
  # resource (template.yaml), which uses imageCountMoreThan instead since it
  # does have one. A prior version of this rule matched on
  # tagPrefixList: ["pr-"], but sam build/deploy actually tags images as
  # apifunction-<content-hash>-latest, not pr-<N> - that pattern never
  # matched anything, so images accumulated unbounded until this was caught
  # and fixed. (ECR's own "description" field has a 255-char limit, hence
  # this reasoning living here instead - confirmed via a real UPDATE_FAILED
  # error rather than assumed.)
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire any image 2 days after push",
                "selection": {
                  "tagStatus": "any",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  ApiRepositoryUri:
    Description: Pass this to sam build/deploy via --image-repositories ApiFunction=<value>
    Value: !GetAtt ApiRepository.RepositoryUri
