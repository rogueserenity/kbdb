version: "2"

linters:
  default: standard
  settings:
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - ginkgolinter
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
  exclusions:
    rules:
      # MCP tool handlers return propagated Go errors from ToolHandlerFor;
      # modelcontextprotocol/go-sdk automatically converts non-nil error
      # into CallToolResult{IsError: true} (in-band, not JSON-RPC failure).
      - path: internal/mcp/
        linters:
          - nilerr
